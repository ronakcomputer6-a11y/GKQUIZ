<head>
  <meta name="robots" content="noindex, nofollow">

  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RTO Question Bank - Protected Demo</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    /* ટેક્સ્ટ સિલેક્શન બંધ કરવા માટે */
    body {
      background: radial-gradient(circle at top left, #1e1b4b, #0f172a, #090d16);
      color: #1f2937;
      font-family: 'Segoe UI', Roboto, sans-serif;
      min-height: 100vh;
      padding-bottom: 40px;
      -webkit-user-select: none; /* Safari */
      -moz-user-select: none;    /* Firefox */
      -ms-user-select: none;     /* IE / Edge */
      user-select: none;         /* Standard */
    }

    /* ફિલ્ટર ટેબ્સ */
    .tabs-container {
      position: sticky;
      top: 0;
      display: flex;
      justify-content: center;
      gap: 14px;
      padding: 20px 16px;
      background: transparent;
      backdrop-filter: blur(8px);
      z-index: 90;
    }

    .tab-btn {
      padding: 11px 26px;
      font-size: 14px;
      font-weight: 700;
      color: #cbd5e1;
      background: rgba(30, 41, 59, 0.85);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 30px;
      cursor: pointer;
      transition: all 0.35s ease;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
    }

    .tab-btn:hover {
      background: rgba(51, 65, 85, 0.95);
      color: #ffffff;
      transform: translateY(-2px);
    }

    .tab-btn.active {
      background: linear-gradient(135deg, #ec4899 0%, #8b5cf6 50%, #3b82f6 100%);
      color: #ffffff;
      border-color: transparent;
      box-shadow: 0 6px 20px rgba(236, 72, 153, 0.5);
    }

    /* ગ્રીડ કન્ટેનર */
    .list-container {
      max-width: 1200px;
      margin: 10px auto 30px auto;
      padding: 0 20px;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(330px, 1fr));
      gap: 24px;
    }

    /* કાર્ડ ડિઝાઇન */
    .q-card {
      background: rgba(255, 255, 255, 0.98);
      border-radius: 22px;
      padding: 24px;
      position: relative;
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.25);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      transition: all 0.35s cubic-bezier(0.4, 0, 0.2, 1);
      overflow: hidden;
      border: 1px solid rgba(255, 255, 255, 0.2);
    }

    .q-card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 5px;
      background: linear-gradient(90deg, #ec4899, #f59e0b, #10b981, #3b82f6);
    }

    .q-card:hover {
      transform: translateY(-8px);
      box-shadow: 0 25px 50px rgba(0, 0, 0, 0.4);
    }

    .q-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 18px;
    }

    .q-badge {
      width: 44px;
      height: 44px;
      color: #ffffff;
      font-size: 16px;
      font-weight: 800;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 6px 15px rgba(0, 0, 0, 0.2);
    }

    .bm-btn {
      background: #f1f5f9;
      border: 1px solid #e2e8f0;
      width: 44px;
      height: 44px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .bm-btn:hover {
      background: #e2e8f0;
      transform: scale(1.1);
    }

    .bm-btn svg {
      width: 20px;
      height: 20px;
      stroke: #64748b;
      fill: none;
      transition: all 0.3s ease;
    }

    .bm-btn.active {
      background: linear-gradient(135deg, #fef3c7 0%, #fde68a 100%);
      border-color: #f59e0b;
      box-shadow: 0 4px 15px rgba(245, 158, 11, 0.35);
    }

    .bm-btn.active svg {
      stroke: #b45309;
      fill: #f59e0b;
      transform: scale(1.15);
    }

    .q-text {
      font-size: 18px;
      font-weight: 800;
      color: #0f172a;
      line-height: 1.6;
      margin-bottom: 20px;
    }

    .ans-section {
      border-top: 1px dashed #cbd5e1;
      padding-top: 16px;
      margin-top: auto;
    }

    .ans-label {
      font-size: 11px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      display: inline-block;
      padding: 4px 12px;
      border-radius: 20px;
      background: linear-gradient(135deg, #059669 0%, #10b981 100%);
      color: #ffffff;
      margin-bottom: 8px;
      box-shadow: 0 3px 10px rgba(16, 185, 129, 0.35);
    }

    .ans-text {
      font-size: 15px;
      color: #334155;
      line-height: 1.5;
      font-weight: 600;
    }

    .empty-msg {
      text-align: center;
      padding: 80px 20px;
      color: #94a3b8;
      font-size: 17px;
      font-weight: 600;
      display: none;
    }
  </style>

    const badgeGradients = [
      'linear-gradient(135deg, #3b82f6, #1d4ed8)',
      'linear-gradient(135deg, #ec4899, #be185d)',
      'linear-gradient(135deg, #8b5cf6, #6d28d9)',
      'linear-gradient(135deg, #f59e0b, #d97706)',
      'linear-gradient(135deg, #10b981, #047857)'
    ];

    const STORAGE_KEY = 'rto_qbank_bookmarks_v6';
    let bookmarkedSet = new Set(JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]'));
    let currentTab = 'all';

    document.addEventListener('DOMContentLoaded', () => {
      renderQuestions();
    });

    function renderQuestions() {
      const container = document.getElementById('questionList');
      const emptyMsg = document.getElementById('emptyMsg');
      container.innerHTML = '';
      
      let visibleCount = 0;

      questionsData.forEach((item, index) => {
        const isBookmarked = bookmarkedSet.has(item.id);

        if (currentTab === 'bm' && !isBookmarked) {
          return;
        }

        visibleCount++;
        const gradient = badgeGradients[index % badgeGradients.length];

        const card = document.createElement('div');
        card.className = 'q-card';
        card.innerHTML = `
          <div>
            <div class="q-header">
              <div class="q-badge" style="background: ${gradient};">${item.id}</div>
              <button class="bm-btn ${isBookmarked ? 'active' : ''}" onclick="toggleBookmark(${item.id})">
                <svg viewBox="0 0 24 24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"></path>
                </svg>
              </button>
            </div>
            <div class="q-text">${item.question}</div>
          </div>
          <div class="ans-section">
            <div class="ans-label">સાચો જવાબ</div>
            <div class="ans-text">${item.answer}</div>
          </div>
        `;
        container.appendChild(card);
      });

      document.getElementById('bmCount').innerText = bookmarkedSet.size;
      emptyMsg.style.display = (currentTab === 'bm' && visibleCount === 0) ? 'block' : 'none';
    }

    function toggleBookmark(qId) {
      if (bookmarkedSet.has(qId)) {
        bookmarkedSet.delete(qId);
      } else {
        bookmarkedSet.add(qId);
      }

      localStorage.setItem(STORAGE_KEY, JSON.stringify(Array.from(bookmarkedSet)));
      renderQuestions();
    }

    function switchTab(tab) {
      currentTab = tab;
      document.getElementById('tabAll').classList.toggle('active', tab === 'all');
      document.getElementById('tabBm').classList.toggle('active', tab === 'bm');
      renderQuestions();
    }

    /* =========================================================
       કોપી પ્રોટેક્શન સિક્યોરિટી ફંક્શન્સ
       ========================================================= */

    // ૧. રાઇટ કલિક ડિસેબલ કરવા માટે
    document.addEventListener('contextmenu', (e) => e.preventDefault());

    // ૨. કોપી અને કટ ઇવેન્ટ ડિસેબલ કરવા માટે
    document.addEventListener('copy', (e) => e.preventDefault());
    document.addEventListener('cut', (e) => e.preventDefault());

    // ૩. કીબોર્ડ શોર્ટકટ્સ બંધ કરવા માટે (Ctrl+C, Ctrl+A, Ctrl+U, F12 વગેરે)
    document.addEventListener('keydown', (e) => {
      if (
        (e.ctrlKey && (e.key === 'c' || e.key === 'C' || e.key === 'u' || e.key === 'U' || e.key === 'a' || e.key === 'A' || e.key === 's' || e.key === 'S')) ||
        e.key === 'F12'
      ) {
        e.preventDefault();
      }
    });
  </script>

</body>
</html>
